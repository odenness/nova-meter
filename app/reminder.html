<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nova Meter · Reminder</title>
<style>
  :root { --c: #f0b232; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; user-select: none; }
  .stack { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; padding-top: 6px; }
  .card { display: flex; align-items: center; gap: 14px; min-width: 340px; max-width: 520px; padding: 10px 18px 10px 10px;
    background: linear-gradient(135deg, rgba(18, 16, 24, .93), rgba(10, 11, 16, .95)); color: #f1f1f4;
    border: 1px solid color-mix(in srgb, var(--c) 70%, transparent); border-radius: 14px;
    box-shadow: 0 0 28px color-mix(in srgb, var(--c) 35%, transparent), 0 12px 32px rgba(0, 0, 0, .55);
    transform: translateY(-30px); opacity: 0; animation: in .45s cubic-bezier(.2, 1.3, .4, 1) forwards; }
  .card.out { animation: out .5s ease forwards; }
  @keyframes in { to { transform: none; opacity: 1; } }
  @keyframes out { to { transform: translateY(-20px); opacity: 0; } }
  .pic { width: 56px; height: 56px; flex: none; border-radius: 10px; object-fit: cover; background: #1d1f27;
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--c) 60%, transparent); display: grid; place-items: center; }
  .pic svg { width: 30px; height: 30px; color: var(--c); }
  .bell { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--c); }
  .title { font-size: 19px; font-weight: 700; line-height: 1.2; }
  .sub { font-size: 13px; color: #a9adbb; margin-top: 2px; }
  .when { margin-left: auto; padding-left: 12px; font: 700 22px Consolas, monospace; color: var(--c); white-space: nowrap; }
</style>
</head>
<body>
<div class="stack" id="stack"></div>
<script type="module">
import { chime } from "./timers.js";
import { EVENT_ICONS } from "./icons.js";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const left = at => { const s = Math.max(0, Math.round((at - Date.now()) / 1000)); return s >= 60 ? `${Math.ceil(s / 60)}m` : s ? `${s}s` : "now"; };

function show(r) {
  const card = document.createElement("div");
  card.className = "card";
  card.style.setProperty("--c", r.color || "#f0b232");
  const pic = r.portrait ? `<img class="pic" src="img/spawns/${esc(r.portrait)}" alt="">`
    : `<div class="pic"><svg viewBox="0 0 24 24" fill="currentColor">${EVENT_ICONS[r.event] || '<path d="M12 2a7 7 0 0 0-7 7v4l-2 3v1h18v-1l-2-3V9a7 7 0 0 0-7-7zm0 21a3 3 0 0 0 3-3H9a3 3 0 0 0 3 3z"/>'}</svg></div>`;
  card.innerHTML = `${pic}<div><div class="bell">Reminder</div><div class="title">${esc(r.text)}</div>
    <div class="sub">${esc(r.sub || "")}</div></div><div class="when" data-at="${r.at}">${left(r.at)}</div>`;
  const stack = document.getElementById("stack");
  stack.prepend(card);
  while (stack.children.length > 3) stack.lastChild.remove();
  if (r.sound) { chime(); setTimeout(chime, 450); }
  setTimeout(() => card.classList.add("out"), (r.seconds || 9) * 1000);
  setTimeout(() => card.remove(), (r.seconds || 9) * 1000 + 600);
}
setInterval(() => document.querySelectorAll("[data-at]").forEach(el => el.textContent = left(+el.dataset.at)), 1000);
window.nova?.onRemind?.(show);
window.novaRemind = show;             // the meter's own page uses this when there's no desktop app
</script>
</body>
</html>
