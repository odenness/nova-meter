<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nova Meter · Personal best</title>
<style>
  :root { --gold: #f3c25a; --gold2: #ffe7a6; --cc: #f3c25a; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; user-select: none; }
  .stage { position: relative; width: 100%; height: 100%; display: grid; place-items: center; opacity: 0; }
  .stage.show { animation: stage 6s ease forwards; }
  @keyframes stage { 0% { opacity: 0; } 6% { opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0; } }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

  .rays { position: absolute; width: 520px; height: 520px; left: 50%; top: 50%; margin: -260px 0 0 -260px; border-radius: 50%;
    background: repeating-conic-gradient(from 0deg, rgba(255, 220, 140, .22) 0deg 6deg, transparent 6deg 20deg);
    -webkit-mask: radial-gradient(circle, #000 18%, transparent 62%); mask: radial-gradient(circle, #000 18%, transparent 62%);
    animation: spin 14s linear infinite; }
  .glow { position: absolute; width: 360px; height: 360px; left: 50%; top: 50%; margin: -180px 0 0 -180px; border-radius: 50%;
    background: radial-gradient(circle, rgba(243, 194, 90, .55), rgba(243, 194, 90, .12) 45%, transparent 70%); filter: blur(6px); }
  @keyframes spin { to { transform: rotate(360deg); } }

  .card { position: relative; display: flex; align-items: center; gap: 22px; padding: 18px 30px 18px 22px;
    background: linear-gradient(135deg, rgba(20, 18, 12, .88), rgba(10, 11, 16, .92));
    border: 1px solid rgba(243, 194, 90, .65); border-radius: 16px;
    box-shadow: 0 0 0 1px rgba(255, 231, 166, .15) inset, 0 0 40px rgba(243, 194, 90, .35), 0 18px 50px rgba(0, 0, 0, .6);
    transform: scale(.6) translateY(20px); opacity: 0; }
  .show .card { animation: pop .7s cubic-bezier(.2, 1.4, .4, 1) .15s forwards, float 3s ease-in-out .9s infinite alternate; }
  @keyframes pop { to { transform: scale(1) translateY(0); opacity: 1; } }
  @keyframes float { from { transform: translateY(0); } to { transform: translateY(-4px); } }
  .card::after { content: ""; position: absolute; inset: 0; border-radius: 16px; pointer-events: none;
    background: linear-gradient(110deg, transparent 30%, rgba(255, 240, 200, .35) 48%, transparent 66%); background-size: 250% 100%;
    background-position: 120% 0; }
  .show .card::after { animation: shine 1.6s ease-out .8s; }
  @keyframes shine { to { background-position: -60% 0; } }

  .medal { position: relative; width: 96px; height: 96px; flex: none; display: grid; place-items: center; }
  .medal svg.star { position: absolute; inset: 0; width: 96px; height: 96px; filter: drop-shadow(0 0 12px rgba(243, 194, 90, .9)); }
  .show .medal svg.star { animation: starspin 1.1s cubic-bezier(.2, 1.2, .4, 1) .2s both; }
  @keyframes starspin { from { transform: rotate(-200deg) scale(.2); } to { transform: rotate(0) scale(1); } }
  .medal img { position: relative; width: 40px; height: 40px; object-fit: contain; filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .8)); }

  .txt { display: flex; flex-direction: column; min-width: 0; }
  .kicker { font: 800 13px "Segoe UI", sans-serif; letter-spacing: .32em; color: var(--gold); text-transform: uppercase;
    text-shadow: 0 0 12px rgba(243, 194, 90, .6); }
  .boss { font-size: 30px; font-weight: 800; color: #fff; line-height: 1.15; margin-top: 2px; white-space: nowrap; text-shadow: 0 2px 6px rgba(0, 0, 0, .7); }
  .line { display: flex; align-items: baseline; gap: 12px; margin-top: 6px; white-space: nowrap; }
  .dps { font: 800 26px "Cascadia Mono", Consolas, monospace; color: var(--gold2); text-shadow: 0 0 14px rgba(243, 194, 90, .55); }
  .dps small { font-size: 14px; color: #d8c79c; margin-left: 4px; }
  .gain { font-weight: 700; font-size: 15px; color: #7cf0ae; }
  .who { color: #c9cdd6; font-size: 13px; margin-top: 4px; }
  .who b { color: var(--cc); }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="glow"></div>
  <div class="rays"></div>
  <canvas id="fx"></canvas>
  <div class="card">
    <div class="medal">
      <svg class="star" viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3c8"/><stop offset=".5" stop-color="#f3c25a"/><stop offset="1" stop-color="#b9821f"/></linearGradient>
        </defs>
        <path d="M50 2 L60 40 L98 50 L60 60 L50 98 L40 60 L2 50 L40 40 Z" fill="url(#g)"/>
        <path d="M50 22 L55 45 L78 50 L55 55 L50 78 L45 55 L22 50 L45 45 Z" fill="#fff7dc" opacity=".55" transform="rotate(45 50 50)"/>
        <circle cx="50" cy="50" r="17" fill="#17130a" stroke="#ffe7a6" stroke-width="2"/>
      </svg>
      <img id="emblem" alt="">
    </div>
    <div class="txt">
      <div class="kicker" id="kicker">New personal best</div>
      <div class="boss" id="boss">Vakron</div>
      <div class="line"><span class="dps" id="dps">0<small>DPS</small></span><span class="gain" id="gain"></span></div>
      <div class="who" id="who"></div>
    </div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const short = n => { const a = Math.abs(n); return a >= 1e6 ? (n / 1e6).toFixed(2) + "M" : a >= 1e3 ? (n / 1e3).toFixed(1) + "K" : String(Math.round(n)); };
const CLASS = { gladiator: "Gladiator", templar: "Templar", assassin: "Assassin", ranger: "Ranger", sorcerer: "Sorcerer", spiritmaster: "Spiritmaster", cleric: "Cleric", chanter: "Chanter", brawler: "Brawler" };

// ---- sound: a short bright fanfare, synthesised (no audio files) ----
function fanfare(volume = 0.5) {
  try {
    const ac = new AudioContext(), t0 = ac.currentTime + 0.05;
    const master = ac.createGain(); master.gain.value = volume; master.connect(ac.destination);
    const note = (f, t, len, type = "triangle", g = .22) => {
      const o = ac.createOscillator(), v = ac.createGain();
      o.type = type; o.frequency.value = f;
      v.gain.setValueAtTime(0, t); v.gain.linearRampToValueAtTime(g, t + .02); v.gain.exponentialRampToValueAtTime(.0008, t + len);
      o.connect(v).connect(master); o.start(t); o.stop(t + len + .05);
    };
    // rising arpeggio, then a held major chord with a sparkle on top
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => note(f, t0 + i * .09, .35));
    [523.25, 659.25, 783.99, 1046.5].forEach(f => note(f, t0 + .42, 1.6, "sine", .16));
    [2093, 2637, 3136, 2637, 3520].forEach((f, i) => note(f, t0 + .5 + i * .07, .4, "sine", .05));
    setTimeout(() => ac.close(), 3000);
  } catch { /* no audio device */ }
}

// ---- sparkles: a burst of gold particles ----
function burst() {
  const c = $("fx"), ctx = c.getContext("2d");
  const W = c.width = innerWidth * devicePixelRatio, H = c.height = innerHeight * devicePixelRatio;
  const parts = Array.from({ length: 110 }, () => {
    const a = Math.random() * Math.PI * 2, s = (2 + Math.random() * 7) * devicePixelRatio;
    return { x: W / 2, y: H / 2, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, life: 1, r: (1 + Math.random() * 2.6) * devicePixelRatio,
             hue: 38 + Math.random() * 18, tw: Math.random() * 6 };
  });
  let frame = 0;
  (function step() {
    ctx.clearRect(0, 0, W, H);
    for (const p of parts) {
      p.x += p.vx; p.y += p.vy; p.vy += .06 * devicePixelRatio; p.vx *= .985; p.life -= .009;
      if (p.life <= 0) continue;
      const a = p.life * (.6 + .4 * Math.sin(frame * .3 + p.tw));
      ctx.fillStyle = `hsla(${p.hue}, 95%, ${65 + 25 * p.life}%, ${a})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    if (++frame < 260) requestAnimationFrame(step); else ctx.clearRect(0, 0, W, H);
  })();
}

function celebrate(d) {
  if (d.kind === "pet") {                       // a pet reached its next level (pet farming)
    $("kicker").textContent = d.max ? "Pet maxed out" : "Pet level up";
    $("boss").textContent = d.name || "Pet";
    $("dps").innerHTML = `Level ${d.level}<small>achieved</small>`;
    $("gain").textContent = d.max ? "Max level: done farming this one" : "";
    $("who").innerHTML = "";
    document.documentElement.style.setProperty("--cc", "#a78bfa");
    $("emblem").src = d.pic || "img/nova.png";
    const st = $("stage");
    st.classList.remove("show"); void st.offsetWidth; st.classList.add("show");
    burst();
    if (d.sound !== false) fanfare(d.volume ?? 0.5);
    return;
  }
  $("kicker").textContent = d.first ? "First kill recorded" : "New personal best";
  $("boss").textContent = d.boss || "Boss";
  $("dps").innerHTML = `${short(d.dps)}<small>DPS</small>`;
  $("gain").textContent = d.prev ? `+${((d.dps / d.prev - 1) * 100).toFixed(1)}% · was ${short(d.prev)}` : "";
  $("who").innerHTML = d.name ? `<b>${d.name.replace(/[<>&]/g, "")}</b> · ${CLASS[d.cls] || ""}` : "";
  document.documentElement.style.setProperty("--cc", d.color || "#f3c25a");
  $("emblem").src = d.cls ? `img/classes/${d.cls}.png` : "img/nova.png";
  const st = $("stage");
  st.classList.remove("show"); void st.offsetWidth; st.classList.add("show");
  burst();
  if (d.sound !== false) fanfare(d.volume ?? 0.5);
}
window.celebrate = celebrate;
if (window.nova?.onCelebrate) window.nova.onCelebrate(celebrate);
const q = new URLSearchParams(location.search);
if (q.has("demo")) celebrate({ boss: q.get("boss") || "Vakron", dps: 128400, prev: 120900, name: "Your character", cls: "gladiator", color: "#e07a4f" });
</script>
</body>
</html>
