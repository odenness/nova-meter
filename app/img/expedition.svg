<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Expedition: a stone archway around a glowing portal (drawn for Nova Meter) -->
  <defs>
    <radialGradient id="portal" cx="50%" cy="58%" r="60%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".28" stop-color="#d8f3ff"/>
      <stop offset=".6" stop-color="#6fc4ff"/>
      <stop offset="1" stop-color="#16406e"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3e6ea"/>
      <stop offset=".55" stop-color="#9aa1aa"/>
      <stop offset="1" stop-color="#4d535b"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>
  <!-- glow spilling out of the gate -->
  <path d="M20 56V30a12 12 0 0 1 24 0v26z" fill="#8fd6ff" opacity=".55" filter="url(#glow)"/>
  <!-- the arch: outer stone ring with a flat base -->
  <path d="M8 58V30a24 24 0 0 1 48 0v28h-9V30a15 15 0 0 0-30 0v28z" fill="url(#stone)" stroke="#2b2f35" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- stone blocks -->
  <g fill="none" stroke="#3a3f46" stroke-width="1.2" stroke-linecap="round" opacity=".85">
    <path d="M12.3 18.2l7.6 5.6M21.6 9.6l3.2 8.9M32 6v9.2M42.4 9.6l-3.2 8.9M51.7 18.2l-7.6 5.6"/>
    <path d="M8 40h9M8 50h9M47 40h9M47 50h9"/>
  </g>
  <!-- keystone -->
  <path d="M28.5 5.6h7l-1.3 9.4h-4.4z" fill="#f2f4f6" stroke="#2b2f35" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- the portal -->
  <path d="M17 58V30a15 15 0 0 1 30 0v28z" fill="url(#portal)"/>
  <path d="M17 58V30a15 15 0 0 1 30 0v28" fill="none" stroke="#bfe8ff" stroke-width="1" opacity=".7"/>
  <!-- ground -->
  <path d="M4 58h56" stroke="#2b2f35" stroke-width="2.4" stroke-linecap="round"/>
</svg>
